[project]
name = "supplychain-control-tower-backend"
version = "0.1.0"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "apscheduler>=3.10.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools]
include-package-data = true
packages = ["app"]
package-data = { "app" = ["**/*.json", "**/*.sql", "**/*.csv"] }

[tool.pytest.ini_options]
pythonpath = ["app"]

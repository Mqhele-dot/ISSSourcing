# CI: lint, type-check, build and artifact on push/PR
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  org-api-isolation:
    runs-on: ubuntu-latest
    needs: lint-and-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invtest
      NODE_ENV: development
      BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # migrate:check validates schema in a temporary database; db:push:force prepares the live CI database before seed.
      - name: Check migrations
        run: npm run migrate:check

      - name: Apply schema to CI database
        run: npm run db:push:force

      - name: Seed demo data
        run: npm run db:seed

      - name: Start API server
        run: |
          npm run dev &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          exit 1

      - name: Org API isolation tests
        run: npm run test:org-api

      - name: API contract + procurement flow (live server)
        run: npm run test:contracts && npm run test:procurement-flow

  release-gate:
    runs-on: ubuntu-latest
    needs: lint-and-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invtest
      SESSION_SECRET: ci-release-gate-secret
      NODE_ENV: development
      BASE_URL: http://127.0.0.1:5000
      PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # migrate:check validates schema in a temporary database; db:push:force prepares the live CI database before seed.
      - name: Check migrations
        run: npm run migrate:check

      - name: Apply schema to CI database
        run: npm run db:push:force

      - name: Seed demo data
        run: npm run db:seed

      - name: Start API server
        run: |
          npm run dev &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          exit 1

      - name: Purchase order endpoint tests
        run: npm run test:purchase-order-endpoints

      - name: Logistics filter tests
        run: npm run test:logistics-filters

      - name: Verify release
        run: npm run verify:release

      - name: Release gate (delta — scripts not covered by verify:release or parallel org-api job)
        run: npm run release:gate:delta

name: backend-ci

on:
  pull_request:
  push:
    branches: [work, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Smoke no deps
        run: PYTHONPATH=. python scripts/smoke_no_deps.py

      - name: Ruff
        run: python -m pip install ruff && ruff check app tests

      - name: Black
        run: python -m pip install black && black --check app tests

      - name: Pytest
        run: PYTHONPATH=. pytest -q

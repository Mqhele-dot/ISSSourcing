# Blocks PR introductions of vulnerabilities at high+ severity (supply-chain gate).
# Requires dependency graph submission; private repos may need GHAS — see docs/security/SECURITY_VERIFICATION_RESULTS.md.

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

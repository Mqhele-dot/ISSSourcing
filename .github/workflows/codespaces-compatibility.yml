name: Codespaces Compatibility

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify-codespaces-flow:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: development
      PORT: 5000
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: inventory_dev
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_dev
      AUTO_SEED_ON_EMPTY_DB: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install native dependencies used in Codespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            pkg-config \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libvips-dev \
            libsqlite3-dev \
            postgresql-client \
            curl

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:push

      - name: Build app
        run: npm run build

      - name: Lint (non-blocking, report-only)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck (non-blocking, tracked)
        id: typecheck
        continue-on-error: true
        run: npm run check

      - name: Report typecheck status
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ]; then
            echo "::warning::Typecheck failed (currently expected while cleanup is in progress)."
          else
            echo "Typecheck passed."
          fi

      - name: Smoke test health endpoint
        run: |
          set -euo pipefail
          npm run dev > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..40}; do
            if curl -fsS "http://127.0.0.1:5000/health" >/dev/null; then
              echo "Health endpoint is reachable."
              exit 0
            fi
            sleep 2
          done

          echo "Health endpoint did not become ready in time."
          cat /tmp/app.log
          exit 1
